name: Build Mod desde ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Descomprimir el ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No hay ningun .zip en la raiz del repositorio"
            exit 1
          fi
          echo "Usando $ZIP"
          mkdir -p mod-src
          unzip -q -o "$ZIP" -d mod-src
          BUILD=$(find mod-src -name build.gradle | head -n 1)
          if [ -z "$BUILD" ]; then
            echo "El zip no contiene build.gradle"
            exit 1
          fi
          echo "MOD_DIR=$(dirname "$BUILD")" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon

      - name: Subir el .jar del mod
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
